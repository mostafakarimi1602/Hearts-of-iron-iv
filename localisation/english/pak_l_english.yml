l_english:
 PAK_rebuild_nation:0 "Rebuild the Nation"
 PAK_rebuild_nation_desc:0 "Pakistan has just been born. We must lay the foundations of a modern nation and establish our identity in South Asia."
 PAK_islamic_republic:0 "Islamic Republic"
 PAK_islamic_republic_desc:0 "The historical path of Pakistan. We must strengthen our Islamic identity and emerge as a leader of the Muslim world."
 PAK_secular_republic:0 "Secular Republic"
 PAK_secular_republic_desc:0 "Jinnah's dream of a modern and democratic Pakistan. The separation of religion and state is the key to progress."
 PAK_empower_military:0 "Empower the Military"
 PAK_empower_military_desc:0 "The military is the backbone of Pakistan. We must concentrate power in the hands of the generals."
 PAK_industrial_effort:0 "Industrial Effort"
 PAK_industrial_effort_desc:0 "Pakistan's weak industry must be strengthened so that we can stand on our own feet."
 PAK_foreign_investment:0 "Foreign Investment"
 PAK_foreign_investment_desc:0 "We must attract foreign capital to build our infrastructure."
 PAK_self_reliance:0 "Self-Reliance"
 PAK_self_reliance_desc:0 "Relying on ourselves is the only way for Pakistan to survive."
 PAK_heavy_industry:0 "Heavy Industry"
 PAK_heavy_industry_desc:0 "Steel mills and heavy industries will be the backbone of our war economy."
 PAK_army_effort:0 "Army Effort"
 PAK_army_effort_desc:0 "We must strengthen our army to defend our borders."
 PAK_air_force_effort:0 "Air Force Effort"
 PAK_air_force_effort_desc:0 "Air superiority will be crucial in any future conflict."
 PAK_nuclear_program:0 "Nuclear Program"
 PAK_nuclear_program_desc:0 "The atomic bomb is the ultimate deterrent against threats."
 PAK_inter_services_intelligence:0 "Inter-Services Intelligence (ISI)"
 PAK_inter_services_intelligence_desc:0 "The ISI must be the eyes and ears of Pakistan in the region."
 PAK_isi_expansion:0 "Expand the ISI"
 PAK_isi_expansion_desc:0 "We must expand our intelligence influence in Afghanistan, India, and Kashmir."
 PAK_balochistan_crisis:0 "Balochistan Crisis"
 PAK_balochistan_crisis_desc:0 "The insurgency in Balochistan must be resolved, whether by force or through negotiation."
 PAK_crush_insurgency:0 "Crush the Insurgency"
 PAK_crush_insurgency_desc:0 "We will show no mercy to the rebels."
 PAK_grant_autonomy:0 "Grant Autonomy"
 PAK_grant_autonomy_desc:0 "Perhaps negotiation is better than war."
 PAK_kashmir_question:0 "The Kashmir Question"
 PAK_kashmir_question_desc:0 "Kashmir is the heart of Pakistan. We will never forget it."
 PAK_operation_grand_slam:0 "Operation Grand Slam"
 PAK_operation_grand_slam_desc:0 "Preparations for the liberation of Kashmir from India's grip."

 # National Ideas
 PAK_islamic_republic_idea:0 "Islamic Republic"
 PAK_islamic_republic_idea_desc:0 "The nation's Islamic identity has been strengthened."
 PAK_secular_republic_idea:0 "Secular Republic"
 PAK_secular_republic_idea_desc:0 "The separation of religion and state increases stability."
 PAK_military_establishment:0 "Military Establishment"
 PAK_military_establishment_desc:0 "The military holds control over the country."
 PAK_industrial_effort_idea:0 "Industrial Effort"
 PAK_industrial_effort_idea_desc:0 "Industry is growing."
 PAK_foreign_investment_idea:0 "Foreign Investment"
 PAK_foreign_investment_idea_desc:0 "Foreign capital is flowing into the country."
 PAK_self_reliance_idea:0 "Self-Reliance"
 PAK_self_reliance_idea_desc:0 "The country relies on itself."
 PAK_heavy_industry_idea:0 "Heavy Industry"
 PAK_heavy_industry_idea_desc:0 "Steel mills are being constructed."
 PAK_army_effort_idea:0 "Army Effort"
 PAK_army_effort_idea_desc:0 "The army is being strengthened."
 PAK_air_force_effort_idea:0 "Air Force Effort"
 PAK_air_force_effort_idea_desc:0 "The air force is being developed."
 PAK_nuclear_program_idea:0 "Nuclear Program"
 PAK_nuclear_program_idea_desc:0 "The nuclear program is progressing."
 PAK_isi_idea:0 "ISI"
 PAK_isi_idea_desc:0 "Pakistan's intelligence service is active."
 PAK_balochistan_crisis_idea:0 "Balochistan Crisis"
 PAK_balochistan_crisis_idea_desc:0 "Balochistan is in turmoil."
 PAK_kashmir_claim_idea:0 "Kashmir Claim"
 PAK_kashmir_claim_idea_desc:0 "We consider Kashmir to be rightfully ours."
 PAK_war_effort_idea:0 "War Effort"
 PAK_war_effort_idea_desc:0 "The country is in a state of war readiness."
 PAK_saudi_turkey_pact:0 "Pact with Saudi Arabia and Turkey"
 PAK_saudi_turkey_pact_desc:0 "We will forge a military alliance with our Muslim brothers in Riyadh and Ankara. An attack on one is an attack on all."
 PAK_iran_trade:0 "Trade with Iran"
 PAK_iran_trade_desc:0 "Our western neighbor can be a valuable trading partner. Let us open our markets to Persian goods."
 PAK_iran_alliance:0 "Alliance with Iran"
 PAK_iran_alliance_desc:0 "A formal alliance with Tehran will secure our western border and strengthen our position in the region."
 PAK_invade_afghanistan:0 "Invade Afghanistan"
 PAK_invade_afghanistan_desc:0 "The Durand Line is a colonial relic. We will bring our Afghan brothers under our protection, one way or another."
 PAK_invade_india:0 "Invade India"
 PAK_invade_india_desc:0 "The final showdown with India is at hand. We will march to Delhi and end the Indian threat once and for all."
 PAK_expand_research:0 "Expand Research Facilities"
 PAK_expand_research_desc:0 "Our nation needs more scientists and engineers. We will invest in new research institutions."
 PAK_state_resources:0 "Exploit State Resources"
 PAK_state_resources_desc:0 "Our lands are rich in oil and steel. Let us put them to use for the glory of Pakistan."
 PAK_isi_elite:0 "ISI Elite Operatives"
 PAK_isi_elite_desc:0 "Our intelligence service must be the finest in the region. We will train a new generation of elite spies."
 PAK_isi_network:0 "Expand Intelligence Network"
 PAK_isi_network_desc:0 "Our agents must penetrate every level of government in the region. We will build a web of informants that spans from Kabul to Delhi."
 PAK_develop_karachi:0 "Develop Karachi"
 PAK_develop_karachi_desc:0 "Karachi is the gateway to Pakistan. We will transform it into a modern industrial metropolis."
 PAK_military_academy:0 "Establish Military Academy"
 PAK_military_academy_desc:0 "A professional officer corps is the backbone of any modern army. We will establish a premier military academy in Quetta."
 PAK_naval_expansion:0 "Naval Expansion"
 PAK_naval_expansion_desc:0 "The Arabian Sea is our lifeline. We must build a navy capable of protecting our shores and trade routes."
 PAK_propaganda_effort:0 "National Propaganda Effort"
 PAK_propaganda_effort_desc:0 "The people must be united behind the government. We will use all means necessary to spread our message."
 PAK_china_relations:0 "Relations with China"
 PAK_china_relations_desc:0 "Beijing is a valuable ally against Indian aggression. We will strengthen our ties with the People's Republic."
 PAK_usa_relations:0 "Relations with the United States"
 PAK_usa_relations_desc:0 "Washington can provide us with economic and military aid. We will open a dialogue with the Americans."
 PAK_claim_bangladesh:0 "Claim Bangladesh"
 PAK_claim_bangladesh_desc:0 "East Bengal was once part of our nation. We will not rest until it is returned to the fold."
 PAK_total_war_idea:0 "Total War"
 PAK_total_war_idea_desc:0 "The nation is on a total war footing. All resources are dedicated to the war effort."
 PAK_military_academy_idea:0 "Military Academy"
 PAK_military_academy_idea_desc:0 "Our officers are trained to the highest standards."
 PAK_naval_expansion_idea:0 "Naval Expansion"
 PAK_naval_expansion_idea_desc:0 "Our navy is growing stronger."
 PAK_china_relations_idea:0 "Chinese Relations"
 PAK_china_relations_idea_desc:0 "Ties with China are strengthening."
 PAK_usa_relations_idea:0 "American Relations"
 PAK_usa_relations_idea_desc:0 "Ties with the United States are strengthening."
 PAK_bangladesh_claim_idea:0 "Bangladesh Claim"
 PAK_bangladesh_claim_idea_desc:0 "We claim the lands of East Bengal."
 PAK_isi_elite_idea:0 "ISI Elite Operatives"
 PAK_isi_elite_idea_desc:0 "Our intelligence service is the finest in the region."
 PAK_isi_network_idea:0 "ISI Network"
 PAK_isi_network_idea_desc:0 "Our spy network spans the entire region."
 pak.1.t:0 "The Islamic Alliance Proposal"
 pak.1.d:0 "Pakistan has extended an offer of a grand military alliance to the Kingdom of Saudi Arabia. They propose that an attack on one Muslim nation shall be considered an attack on all. Will we answer the call of our brothers?"
 pak.1.a:0 "We shall stand with our Pakistani brothers!"
 pak.1.b:0 "We must decline. Our interests lie elsewhere."
 pak.2.t:0 "The Islamic Alliance Proposal"
 pak.2.d:0 "A delegation from Pakistan has arrived in Ankara with a proposal for a mutual defense pact. They seek to forge a new Islamic alliance in the region, with Pakistan at its heart. This is a historic opportunity."
 pak.2.a:0 "An alliance of Muslim nations is a noble cause. We accept."
 pak.2.b:0 "We have no interest in such an alliance at this time."